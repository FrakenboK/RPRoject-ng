services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q 'Ok.'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  etl-init:
    build:
      context: ./r-etl
      dockerfile: docker/Dockerfile.etl
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      STAGING_DIR: /tmp/r-etl-staging
      TZ: ${TZ:-UTC}
    restart: "no"

  analysis:
    build:
      context: ./r-analysis
      dockerfile: docker/Dockerfile.analysis
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      SIGMA_RULES_DIR: /app/rules/signature
      ANALYSIS_WINDOW_MINUTES: ${ANALYSIS_WINDOW_MINUTES:-5}
      TZ: ${TZ:-UTC}
    restart: "no"

  ui:
    build:
      context: ./r-ui
      dockerfile: docker/Dockerfile.ui
    depends_on:
      clickhouse:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 9000
      COMPOSE_PROJECT_DIR: /compose
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-rproject-ng}
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
      - ./r-ui/R:/app/R:ro
    ports:
      - "${UI_PORT:-3838}:3838"
    restart: unless-stopped

volumes:
  clickhouse_data:

title: Known Backdoor or RAT Ports
id: net-backdoor-known-ports
status: experimental
description: Detects established TCP sessions on ports commonly used by backdoors and RAT tools.
author: team
logsource:
    category: network_connection
    product: idc
detection:
    selection_proto:
        transport_proto: TCP
    selection_ports:
        dst_port:
            - 1234
            - 2222
            - 4444
            - 5555
            - 6666
            - 7777
            - 8888
            - 9999
            - 12345
            - 31337
            - 54321
            - 65535
    selection_state:
        flow_state:
            - FIN
            - CON
    selection_duration:
        duration_sec|gte: 5
    condition: selection_proto and selection_ports and selection_state and selection_duration
level: high
tags:
    - attack.command-and-control
    - attack.t1571
    - network

title: Telnet Failed Access Candidate
id: net-suspicious-telnet-access
status: experimental
description: Detects failed TCP connection attempts to Telnet administration ports.
author: team
logsource:
    category: network_connection
    product: idc
detection:
    selection_proto:
        transport_proto: TCP
    selection_ports:
        dst_port:
            - 23
            - 2323
    selection_state:
        flow_state:
            - INT
            - REQ
            - RST
            - CLO
    condition: selection_proto and selection_ports and selection_state
level: medium
tags:
    - attack.initial-access
    - attack.t1021
    - network

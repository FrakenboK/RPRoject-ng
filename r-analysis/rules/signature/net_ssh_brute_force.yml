title: SSH Brute Force Candidate
id: net-ssh-brute-force
status: experimental
description: Detects TCP sessions to SSH with failure-like connection states, indicating brute force or probing attempts.
author: team
logsource:
    category: network_connection
    product: idc
detection:
    selection_proto:
        transport_proto: TCP
        dst_port: 22
    selection_state:
        flow_state:
            - INT
            - REQ
            - RST
    condition: selection_proto and selection_state
level: high
tags:
    - attack.credential-access
    - attack.t1110
    - network

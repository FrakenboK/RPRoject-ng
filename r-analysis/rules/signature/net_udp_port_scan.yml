title: UDP Port Scan Candidate
id: net-udp-port-scan
status: experimental
description: Detects small UDP probes to multiple ports, typical of UDP scanning activity.
author: team
logsource:
    category: network_connection
    product: idc
detection:
    selection_proto:
        transport_proto: UDP
    selection_bytes:
        bytes_src|lte: 128
    selection_state:
        flow_state:
            - REQ
            - INT
    condition: selection_proto and selection_bytes and selection_state
level: medium
tags:
    - attack.discovery
    - attack.t1046
    - network

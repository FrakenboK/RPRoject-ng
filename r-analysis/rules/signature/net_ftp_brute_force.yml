title: FTP Brute Force Candidate
id: net-ftp-brute-force
status: experimental
description: Detects TCP sessions to FTP with failure-like connection states indicating brute force attempts.
author: team
logsource:
    category: network_connection
    product: idc
detection:
    selection_proto:
        transport_proto: TCP
        dst_port: 21
    selection_state:
        flow_state:
            - INT
            - REQ
            - RST
            - CLO
    condition: selection_proto and selection_state
level: medium
tags:
    - attack.credential-access
    - attack.t1110
    - network

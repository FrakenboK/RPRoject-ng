title: High TCP Failure Ratio Host
id: net-high-failure-ratio-host
status: experimental
description: Detects TCP flows with failure-like connection states, indicating scanning or brute force from a host. Broad net for subsequent aggregation.
author: team
logsource:
    category: network_connection
    product: idc
detection:
    selection_proto:
        transport_proto: TCP
    selection_state:
        flow_state:
            - INT
            - REQ
            - RST
            - CLO
    condition: selection_proto and selection_state
level: low
tags:
    - attack.discovery
    - attack.t1046
    - network
